# Heavy Haze (smog) shader pack
#
# The pack draws its own physically-based haze sky, sun and moon in the
# composite pass, so the vanilla sky elements are disabled here.

sky=false
sun=false
moon=false
stars=false
clouds=off

# Shadow pass.
shadowTerrain=true
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=false

# Distant Horizons: keep the DH shadow pass off — distant LOD shadows are
# invisible through the haze anyway, and the vanilla shadow pass attributes
# are not available to DH programs.
dhShadow.enabled=false

# Keep the deferred lightmap/normal buffers clean for translucent geometry.
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off

# Show HAZE_DENSITY as a slider in the shader settings screen.
sliders=HAZE_DENSITY
